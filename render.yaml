# Render Blueprint. Create from the dashboard, or import this file.
services:
  - type: web
    name: personal-blog-api
    runtime: python
    rootDir: backend
    # preDeployCommand is paid-plan only, so migrations run in the build instead.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python create_superuser.py
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personal-blog-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: personal-blog-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://personal-blog-oj84.onrender.com

databases:
  - name: personal-blog-db
    plan: free
