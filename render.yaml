# Render Blueprint. Create from the dashboard, or import this file.
services:
  - type: web
    name: personal-blog-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    preDeployCommand: python manage.py migrate && python create_superuser.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personal-blog-db
          property: connectionString

databases:
  - name: personal-blog-db
    plan: free
